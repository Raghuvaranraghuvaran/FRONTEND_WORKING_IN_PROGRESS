services:
  - type: web
    name: returnguard-api
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_ENGINE
        value: "sqlite"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.3"
